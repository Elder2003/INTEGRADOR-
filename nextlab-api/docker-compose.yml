services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nextlab
      POSTGRES_PASSWORD: nextlab
      POSTGRES_DB: nextlab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextlab"]
      interval: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
