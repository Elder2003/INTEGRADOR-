services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextlab
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

  # Deterministic local AI simulator. It avoids downloading models during a demo.
  test-ai:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test-ai
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/nextlab?sslmode=disable
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: nextlab
      MINIO_USE_SSL: "false"
      API_PORT: "8080"
      LOG_LEVEL: info
      APP_ENV: demo
      JWT_SECRET: nextlab-dev-secret-key-change-in-production-env
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 168h
      GOOGLE_CLIENT_ID: dev-google-client-id
      GOOGLE_CLIENT_SECRET: dev-google-client-secret
      GOOGLE_REDIRECT_URL: http://localhost:8081/auth/google/callback
      AI_PRIMARY_URL: http://test-ai:8081
      AI_PRIMARY_MODEL: nextlab-test-model
      AI_PRIMARY_TIMEOUT_SECS: "5"
      AI_CLOUD_URL: http://test-ai:8081
      AI_CLOUD_API_KEY: demo-only
      AI_EMBED_URL: http://test-ai:8081
      AI_EMBED_MODEL: nextlab-test-embedding
      AI_EMBED_DIMENSION: "768"
      RAG_CHUNK_TOKENS: "512"
      RAG_CHUNK_OVERLAP: "64"
      RAG_TOKEN_BUDGET: "2048"
      HEURISTIC_TAB_WEIGHT: "5"
      HEURISTIC_CLIP_WEIGHT: "3"
      HEURISTIC_GAP_WEIGHT: "2"
      HEURISTIC_HIGH_THRESHOLD: "60"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      test-ai:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    restart: unless-stopped
    profiles: ["background"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/nextlab?sslmode=disable
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: nextlab
      MINIO_USE_SSL: "false"
      API_PORT: "8080"
      LOG_LEVEL: info
      APP_ENV: development
      JWT_SECRET: nextlab-dev-secret-key-change-in-production-env
      GOOGLE_CLIENT_ID: dev-google-client-id
      GOOGLE_CLIENT_SECRET: dev-google-client-secret
      GOOGLE_REDIRECT_URL: http://localhost:8080/auth/google/callback
      AI_PRIMARY_URL: http://test-ai:8081
      AI_PRIMARY_MODEL: nextlab-test-model
      AI_PRIMARY_TIMEOUT_SECS: "5"
      AI_CLOUD_URL: http://test-ai:8081
      AI_CLOUD_API_KEY: demo-only
      AI_EMBED_URL: http://test-ai:8081
      AI_EMBED_MODEL: nextlab-test-embedding
      AI_EMBED_DIMENSION: "768"
      RAG_CHUNK_TOKENS: "512"
      RAG_CHUNK_OVERLAP: "64"
      RAG_TOKEN_BUDGET: "2048"
      HEURISTIC_TAB_WEIGHT: "5"
      HEURISTIC_CLIP_WEIGHT: "3"
      HEURISTIC_GAP_WEIGHT: "2"
      HEURISTIC_HIGH_THRESHOLD: "60"
    depends_on:
      - api
    command: ./worker

  # Inserts presentation accounts and data after the API applies its migrations.
  demo-seed:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./scripts/seed-test-users.sql:/seed/seed-test-users.sql:ro
    depends_on:
      api:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - >
        until psql -h postgres -U postgres -d nextlab -c 'SELECT 1 FROM users LIMIT 1' >/dev/null 2>&1;
        do sleep 2; done;
        psql -h postgres -U postgres -d nextlab -f /seed/seed-test-users.sql

volumes:
  postgres_data:
  redis_data:
  minio_data:
