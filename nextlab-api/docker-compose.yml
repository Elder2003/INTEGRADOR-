version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextlab
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/nextlab?sslmode=disable
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      API_PORT: 8080
      LOG_LEVEL: info
      APP_ENV: development
      JWT_SECRET: nextlab-dev-secret-key-change-in-production-env
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 168h
      # AI Router (M6)
      AI_PRIMARY_URL: http://ollama:11434
      AI_PRIMARY_MODEL: llama3
      AI_PRIMARY_TIMEOUT_SECS: "30"
      AI_CLOUD_URL: ""       # set to Vercel AI Gateway URL for cloud/auto mode
      AI_CLOUD_API_KEY: ""   # set to Vercel AI Gateway API key for cloud/auto mode
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ./api

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/nextlab?sslmode=disable
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      API_PORT: 8080
      LOG_LEVEL: info
      APP_ENV: development
    depends_on:
      api:
        condition: service_started
    command: ./worker

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    profiles:
      - tools
    command: ["-path=/migrations", "-database=postgres://postgres:postgres@postgres:5432/nextlab?sslmode=disable", "up"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
